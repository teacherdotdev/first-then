<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#f1f5f9" />
    <meta name="description" content="A simple First / Then visual board." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="First / Then" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>First / Then</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- Cloudflare Web Analytics. CF_BEACON_TOKEN is set only on the
         production Vercel environment, so local and preview builds don't count visits. -->
    <script>
      {
        const token = "%sveltekit.env.CF_BEACON_TOKEN%";
        if (token) {
          const beacon = document.createElement("script");
          beacon.type = "module";
          beacon.dataset.cfBeacon = JSON.stringify({ token });
          beacon.src = "https://static.cloudflareinsights.com/beacon.min.js";
          document.body.append(beacon);
        }
      }
    </script>
  </body>
</html>
